services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-FinStocks_Strong_Password_123}"
    ports:
      - "1433:1433"
    volumes:
      - finstocks-db:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=database,1433;Initial Catalog=finshark;User ID=sa;Password=${SA_PASSWORD:-FinStocks_Strong_Password_123};TrustServerCertificate=True"
      JWT__SigningKey: "${JWT_SIGNING_KEY:-ChangeThisDevelopmentSigningKeyToAtLeast64BytesForHS512Signing!!!}"
      JWT__Issuer: "${JWT_ISSUER:-FinStocks.Api}"
      JWT__Audience: "${JWT_AUDIENCE:-FinStocks.Client}"
      FMPKey: "${FMP_KEY:-}"
      SECUserAgent: "${SEC_USER_AGENT:-}"
    ports:
      - "5167:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./fin_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5167"
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  finstocks-db:
